<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Worker fallback browser verification</title>
<p>Pengujian koneksi dengan data tiruan.</p>
<script type="module">
import { installWorkerFallback } from '/js/worker-fallback.mjs';
const options = {
    primaryUrl: 'https://simas-smagesa-api.komangpurna1.workers.dev',
    gatewayUrl: 'http://127.0.0.1:8766/functions/v1/worker-gateway',
    connectTimeoutMs: Number(new URL(location.href).searchParams.get('timeout')) || 5000,
    probeTimeoutMs: 3000, gatewayTimeoutMs: 10000
};
window.testTransport = installWorkerFallback(options);
window.sameTransport = installWorkerFallback(options) === window.testTransport;
window.workerReady = true;
</script>
</html>
