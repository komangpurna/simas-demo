APP_BASE_URL = "https://simas-demo-5ead3.web.app"
SUPABASE_URL = "https://wwvtthoeknizglicrhor.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dnR0aG9la25pemdsaWNyaG9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MjAzOTgsImV4cCI6MjEwMjM5NjM5OH0.opR-NvBZYWawcRdUeqX2M-jyJBRhcL2ggeTBVQbQTvo"

# Dispatcher cron tunggal (setiap 10 menit). Memenuhi limit Cloudflare Workers Free (maksimal 5 cron triggers per akun).
# Menjalankan retry outbox notifikasi secara kontinu serta mendispatch ulang tahun siswa (06:00 WITA), agenda sekolah (08:00 WITA),
# pengingat presensi (10:00 WITA), pengingat KBM (15:00 WITA), dan cleanup retensi (02:00 WITA)
# secara terpadu dan idempoten harian.
[triggers]
crons = ["*/10 * * * *"]

