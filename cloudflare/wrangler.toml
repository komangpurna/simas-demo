name = "simas-smagesa-api"
main = "worker.js"
compatibility_date = "2024-08-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "simas-demo-db"
database_id = "5ab663e4-b504-4c82-adeb-52f8471c5063"

# Cloudflare R2 Bucket Binding (Foto Siswa Resmi & Digital Card)
[[r2_buckets]]
binding = "STUDENT_PHOTOS_BUCKET"
bucket_name = "simas-demo-student-photos"

# Cloudflare R2 Bucket Binding (Foto Profil GTK & Staf Sekolah)
[[r2_buckets]]
binding = "GTK_PHOTOS_BUCKET"
bucket_name = "simas-demo-gtk-photos"

# Environment Variables
[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "simas-demo-5ead3"
