<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Jadwal Pelajaran - SIMAS SMAGESA</title>
    <link rel="icon" type="image/png" href="assets/logo-sekolah.png">
    <link rel="manifest" href="manifest.json">
    <!-- Preconnect untuk mempercepat koneksi ke CDN -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 10px !important;
            }
            #app-layout, .no-print {
                display: none !important;
            }
            main {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            .print-only {
                display: block !important;
            }
            .matrix-table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            .matrix-table th, .matrix-table td {
                border: 1px solid #94a3b8 !important;
                padding: 3px 4px !important;
                page-break-inside: avoid !important;
            }
            .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl {
                box-shadow: none !important;
            }
            .ring-2, .ring-1 {
                box-shadow: none !important;
                border: 1.5px solid #2563eb !important;
            }
        }
    </style>
    <script type="module" src="js/school-config.js"></script>
    <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen min-h-dvh">

    <div id="app-layout"></div>

    <main class="hidden fade-in">

        <!-- PRINT HEADER (Hanya muncul saat cetak) -->
        <div class="hidden print-only text-center mb-3 border-b-2 border-slate-800 pb-2">
            <h1 class="text-base font-bold uppercase tracking-wider text-slate-900">{{schoolNameUpper}}</h1>
            <p class="text-[11px] text-slate-600">Jadwal Pelajaran KBM Mingguan (aSc Timetables XML SSOT)</p>
            <p id="print-subtitle" class="text-xs font-bold text-blue-800 mt-0.5"></p>
        </div>

        <!-- HEADER & TOOLBAR -->
        <div class="no-print flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm">
            <div>
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-calendar-week text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white leading-tight">Jadwal Pelajaran</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Jadwal KBM Mingguan (Senin s.d. Jumat) Terpadu</p>
                    </div>
                </div>
            </div>

            <!-- Segmented Control Switcher & Action Buttons -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <!-- Mode Switcher -->
                <div class="bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl flex items-center gap-1 border border-slate-200 dark:border-slate-600 shrink-0">
                    <button id="btn-mode-kelas" onclick="switchScheduleMode('kelas')"
                        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-blue-600 text-white shadow-sm">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Per Kelas</span>
                    </button>
                    <button id="btn-mode-guru" onclick="switchScheduleMode('guru')"
                        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-white">
                        <i class="fa-solid fa-user-tie"></i>
                        <span>Per Guru</span>
                    </button>
                    <button id="btn-mode-kosong" onclick="switchScheduleMode('kosong')"
                        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-white">
                        <i class="fa-solid fa-mug-saucer"></i>
                        <span>Jadwal Kosong Guru</span>
                    </button>
                </div>

                <!-- Print Button -->
                <button onclick="window.print()" title="Cetak Jadwal"
                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-xs font-bold transition-all border border-slate-200 dark:border-slate-600 flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">Cetak</span>
                </button>

                <!-- Refresh XML Button -->
                <button onclick="refreshScheduleXML(true)" title="Sinkronisasi Data XML Terkini"
                    class="p-1.5 sm:px-2.5 bg-slate-100 hover:bg-blue-50 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-lg text-xs font-bold transition-all border border-slate-200 dark:border-slate-600 flex items-center gap-1" id="btn-refresh-xml">
                    <i class="fa-solid fa-rotate text-xs"></i>
                </button>
            </div>
        </div>

        <!-- FILTER & SELECTION CARD -->
        <div class="no-print bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm p-4 mb-4 relative z-30">
            <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                
                <!-- Selector Kelas (Muncul saat Mode Kelas) -->
                <div id="container-select-kelas" class="flex-1">
                    <label class="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">
                        <i class="fa-solid fa-users mr-1 text-blue-600"></i>Pilih Rombongan Belajar (Kelas):
                    </label>
                    <div>
                        <select id="select-schedule-class" onchange="handleClassSelectChange()"
                            class="w-full py-2.5 px-3.5 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold bg-slate-50 dark:bg-slate-700/80 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                            <option value="">Memuat daftar kelas...</option>
                        </select>
                    </div>
                </div>

                <!-- Searchable Selector Guru (Muncul saat Mode Guru) -->
                <div id="container-select-guru" class="hidden flex-1 relative z-40">
                    <label class="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">
                        <i class="fa-solid fa-chalkboard-teacher mr-1 text-blue-600"></i>Cari / Pilih Guru Pengampu:
                    </label>
                    <div class="relative">
                        <input type="text" id="input-search-teacher" placeholder="Ketik nama atau kode guru untuk mencari..." autocomplete="off"
                            class="w-full py-2.5 px-3.5 pr-9 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-semibold bg-slate-50 dark:bg-slate-700/80 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                        <button type="button" id="btn-clear-teacher-search" onclick="clearTeacherSearch()" class="hidden absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-circle-xmark text-sm"></i>
                        </button>
                    </div>
                    <!-- Dropdown List Hasil Pencarian -->
                    <div id="dropdown-teacher-list" class="hidden absolute left-0 right-0 top-full mt-1.5 z-50 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-2xl max-h-64 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
                        <!-- Diisi list guru secara dinamis -->
                    </div>
                </div>

                <!-- Selector & Filter Jadwal Kosong Guru (Muncul saat Mode Kosong) -->
                <div id="container-select-kosong" class="hidden flex-1 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-2.5 flex-1">
                        <!-- Switcher Sub-View (Per Jam JP vs Matriks Guru) -->
                        <div class="bg-slate-100 dark:bg-slate-700/80 p-1 rounded-xl flex items-center gap-1 border border-slate-200 dark:border-slate-600 shrink-0">
                            <button type="button" id="btn-subview-slots" onclick="switchFreeSubView('slots')"
                                class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-blue-600 text-white shadow-xs">
                                <i class="fa-solid fa-clock"></i>
                                <span>Per Jam (JP)</span>
                            </button>
                            <button type="button" id="btn-subview-matrix" onclick="switchFreeSubView('matrix')"
                                class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-white">
                                <i class="fa-solid fa-table-list"></i>
                                <span>Matriks Guru</span>
                            </button>
                        </div>

                        <!-- Filter Hari (Hanya Muncul saat Sub-View Slots) -->
                        <div id="container-filter-day" class="w-full sm:w-44 shrink-0">
                            <select id="select-free-day" onchange="handleFreeDayChange()"
                                class="w-full py-2 px-3 border border-slate-200 dark:border-slate-600 rounded-xl text-xs sm:text-sm font-semibold bg-slate-50 dark:bg-slate-700/80 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                                <option value="all">Semua Hari (Mingguan)</option>
                                <option value="1">Senin</option>
                                <option value="2">Selasa</option>
                                <option value="3">Rabu</option>
                                <option value="4">Kamis</option>
                                <option value="5">Jumat</option>
                            </select>
                        </div>

                        <!-- Filter Jam Pelajaran (JP) - Muncul saat Sub-View Slots -->
                        <div id="container-filter-jp" class="w-full sm:w-48 shrink-0">
                            <select id="select-free-jp" onchange="handleFreeJPChange()"
                                class="w-full py-2 px-3 border border-slate-200 dark:border-slate-600 rounded-xl text-xs sm:text-sm font-semibold bg-slate-50 dark:bg-slate-700/80 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                                <option value="all">Semua Jam (JP 1 - 10)</option>
                                <option value="1">JP 1 (07:30 - 08:15)</option>
                                <option value="2">JP 2 (08:15 - 09:00)</option>
                                <option value="3">JP 3 (09:00 - 09:45)</option>
                                <option value="4">JP 4 (10:00 - 10:45)</option>
                                <option value="5">JP 5 (10:45 - 11:30)</option>
                                <option value="6">JP 6 (11:30 - 12:15)</option>
                                <option value="7">JP 7 (12:30 - 13:15)</option>
                                <option value="8">JP 8 (13:15 - 14:00)</option>
                                <option value="9">JP 9 (14:00 - 14:45)</option>
                                <option value="10">JP 10 (14:45 - 15:30)</option>
                            </select>
                        </div>

                        <!-- Cari Guru -->
                        <div class="flex-1 min-w-[170px] relative">
                            <div class="relative">
                                <input type="text" id="input-search-free-teacher" oninput="handleFreeSearchInput()" placeholder="Cari nama atau NIP guru..." autocomplete="off"
                                    class="w-full py-2 px-3 pr-8 border border-slate-200 dark:border-slate-600 rounded-xl text-xs sm:text-sm font-semibold bg-slate-50 dark:bg-slate-700/80 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                                <button type="button" id="btn-clear-free-search" onclick="clearFreeTeacherSearch()" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Tombol Pintas Jump to Live JP -->
                    <div class="shrink-0 flex items-center gap-2 self-end md:self-auto">
                        <button type="button" id="btn-jump-live-jp" onclick="jumpToCurrentLiveJP()"
                            class="hidden px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-all shadow-xs flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-bolt-lightning text-amber-300"></i>
                            <span>JP Saat Ini</span>
                        </button>
                    </div>
                </div>

                <!-- Info Badges & Stat Container -->
                <div id="schedule-stat-container" class="flex items-center gap-2 shrink-0 pt-1 md:pt-0">
                    <!-- Diisi secara dinamis oleh JS -->
                </div>
            </div>
        </div>

        <!-- MOBILE DAY SELECTOR (Khusus Mode Kelas & Guru pada Mobile < 768px) -->
        <div id="mobile-day-selector-container" class="md:hidden no-print mb-3 bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
            <button onclick="setMobileActiveDay(1)" data-day="1" class="mobile-day-btn flex-1 py-1.5 text-xs font-bold rounded-lg text-center bg-blue-600 text-white transition-all">Senin</button>
            <button onclick="setMobileActiveDay(2)" data-day="2" class="mobile-day-btn flex-1 py-1.5 text-xs font-bold rounded-lg text-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">Selasa</button>
            <button onclick="setMobileActiveDay(3)" data-day="3" class="mobile-day-btn flex-1 py-1.5 text-xs font-bold rounded-lg text-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">Rabu</button>
            <button onclick="setMobileActiveDay(4)" data-day="4" class="mobile-day-btn flex-1 py-1.5 text-xs font-bold rounded-lg text-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">Kamis</button>
            <button onclick="setMobileActiveDay(5)" data-day="5" class="mobile-day-btn flex-1 py-1.5 text-xs font-bold rounded-lg text-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">Jumat</button>
        </div>

        <!-- =================== WRAPPER MODE KELAS & GURU =================== -->
        <div id="container-matrix-view">
            <!-- =================== DESKTOP WEEKLY MATRIX TABLE =================== -->
            <div class="hidden md:block bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden mb-6">
                <div class="overflow-x-auto">
                    <table class="w-full text-xs matrix-table border-collapse" id="table-weekly-matrix">
                        <thead class="bg-slate-800 text-white border-b border-slate-700" id="matrix-thead">
                            <tr>
                                <th class="p-3 text-center font-bold w-24 border-r border-slate-700 shrink-0">Jam & Waktu</th>
                                <th id="th-day-1" class="p-3 text-center font-bold border-r border-slate-700 w-1/5 transition-colors">Senin</th>
                                <th id="th-day-2" class="p-3 text-center font-bold border-r border-slate-700 w-1/5 transition-colors">Selasa</th>
                                <th id="th-day-3" class="p-3 text-center font-bold border-r border-slate-700 w-1/5 transition-colors">Rabu</th>
                                <th id="th-day-4" class="p-3 text-center font-bold border-r border-slate-700 w-1/5 transition-colors">Kamis</th>
                                <th id="th-day-5" class="p-3 text-center font-bold w-1/5 transition-colors">Jumat</th>
                            </tr>
                        </thead>
                        <tbody id="matrix-tbody">
                            <tr>
                                <td colspan="6" class="p-10 text-center text-slate-400">
                                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-600 mb-2"></i>
                                    <p>Memuat data jadwal pelajaran...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- =================== MOBILE LIST VIEW =================== -->
            <div class="md:hidden space-y-2 mb-6" id="mobile-list-container">
                <!-- Diisi oleh JS untuk tampilan mobile per hari terpilih -->
            </div>
        </div>

        <!-- =================== WRAPPER MODE JADWAL KOSONG GURU =================== -->
        <div id="container-kosong-view" class="hidden space-y-4 mb-6">
            <!-- Diisi secara dinamis oleh renderFreeTeachersView() di page-jadwal.js -->
        </div>

    </main>

    <!-- LOADING INDICATOR -->
    <div id="loading-indicator"
        class="hidden fixed bottom-6 right-6 z-[100] bg-white dark:bg-slate-800 px-4 py-3 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 flex items-center gap-3 fade-in">
        <div class="relative">
            <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
        </div>
        <div>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-100">Sinkronisasi Jadwal...</p>
            <p class="text-[10px] text-slate-500 dark:text-slate-400">Membaca data XML SSOT</p>
        </div>
    </div>

    <!-- Script Halaman -->
    <script type="module" src="js/page-jadwal.js?v=26.11.02.3"></script>
</body>

</html>
